let movies=DATA.movies, editions=DATA.editions;
const DEFAULT_COLLECTIONS=['Core','Music Movies','Tom Cruise','Bruce Willis','Kung Fu','Medieval','80s','90s','Rewatch Soon','Upgrade Wanted'];
let user=JSON.parse(localStorage.getItem('pmc_user_v5')||localStorage.getItem('pmc_user_v4')||'null')||{collections:DEFAULT_COLLECTIONS,memberships:{},notes:{},ratings:{},watched:{}};
let view='movies', currentMovie=null;
function save(){localStorage.setItem('pmc_user_v5',JSON.stringify(user));localStorage.setItem('pmc_user_v4',JSON.stringify(user));}
function fmtOfEdition(e){return e.format||((e.title||'').includes('4K')?'4K UHD':(e.title||'').includes('Blu-ray')?'Blu-ray':(e.title||'').includes('DVD')?'DVD':'Other');}
function movieFormats(m){return [...new Set((m.editions||[]).map(fmtOfEdition))];}
function movieCollections(id){return user.memberships[id]||[];}
function movieUserText(m){return [...movieCollections(m.id),user.notes[m.id]||'',user.ratings[m.id]||'',user.watched[m.id]||''].join(' ').toLowerCase();}
function setView(v){view=v;document.querySelectorAll('header button').forEach(b=>b.classList.remove('active'));document.getElementById(v+'Btn')?.classList.add('active');render();}
function fillFilters(){let s=document.getElementById('collectionFilter'), old=s.value; s.innerHTML='<option value="">All Collections</option>'+user.collections.map(c=>`<option>${esc(c)}</option>`).join(''); if([...s.options].some(o=>o.value===old)) s.value=old;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

function hiResCandidates(url){
  url=String(url||'').trim();
  if(!url) return [''];
  let out=[];
  const add=u=>{ if(u && !out.includes(u)) out.push(u); };
  // Blu-ray.com usually embeds small thumbnails. Try larger common filename variants first.
  add(url.replace('_small.jpg','_large.jpg'));
  add(url.replace('_small.jpg','_front.jpg'));
  add(url.replace('_small.jpg','_cover.jpg'));
  add(url.replace('_small.jpg','.jpg'));
  add(url.replace(/_small(\.[a-zA-Z0-9]+)$/,'$1'));
  add(url);
  return out;
}
function smartImg(url, cls, alt=''){
  let c=hiResCandidates(url);
  let fallbacks=c.slice(1).join('|');
  return `<img tabindex="-1" class="${cls} imgloading" loading="lazy" decoding="async" alt="${esc(alt)}" src="${esc(c[0])}" data-fallbacks="${esc(fallbacks)}" onload="this.classList.remove('imgloading')" onerror="imgFallback(this)">`;
}
function imgFallback(img){
  let f=(img.dataset.fallbacks||'').split('|').filter(Boolean);
  if(!f.length){ img.onerror=null; return; }
  img.src=f.shift();
  img.dataset.fallbacks=f.join('|');
}

function matchMovie(m,q,cf,ff){let text=[m.title,m.year,...(m.editions||[]).map(e=>e.title),movieUserText(m)].join(' ').toLowerCase();return (!q||text.includes(q))&&(!cf||movieCollections(m.id).includes(cf))&&(!ff||movieFormats(m).includes(ff));}
function render(){fillFilters();let q=document.getElementById('q').value.toLowerCase().trim(), cf=document.getElementById('collectionFilter').value, ff=document.getElementById('formatFilter').value, grid=document.getElementById('grid'); grid.className='grid'; grid.innerHTML=''; if(view==='movies'){let list=movies.filter(m=>matchMovie(m,q,cf,ff));document.getElementById('stats').textContent=`${list.length} of ${movies.length} movies • ${editions.length} physical editions`; if(!list.length) grid.innerHTML='<div class="empty">No movies match that search/filter.</div>'; list.forEach(m=>grid.appendChild(movieCard(m)));} if(view==='shelf'){let list=editions.filter(e=>(!q||[e.title,...(e.movies||[])].join(' ').toLowerCase().includes(q))&&(!ff||fmtOfEdition(e)===ff));document.getElementById('stats').textContent=`${list.length} of ${editions.length} physical editions`; if(!list.length) grid.innerHTML='<div class="empty">No physical editions match that search/filter.</div>'; list.forEach(e=>grid.appendChild(shelfCard(e)));} if(view==='collections'){document.getElementById('stats').textContent=`${user.collections.length} custom collections`; renderCollections(grid);}}
function movieCard(m){let d=document.createElement('div');d.className='card';d.tabIndex=0;d.onclick=()=>openMovie(m);d.onkeydown=e=>{if(e.key==='Enter')openMovie(m)};let watched=user.watched[m.id]==='Watched'?'✓ ':'';d.innerHTML=`${smartImg(m.poster,'poster',m.title)}<div class="cardbody"><div class="title">${watched}${esc(m.title)}</div><div class="meta">${esc(m.year||'')} ${m.runtime?'• '+esc(m.runtime)+' min':''} ${movieFormats(m).join(', ')}</div><div class="chips">${movieCollections(m.id).slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div>`;return d;}
function shelfCard(e){let d=document.createElement('div');d.className='card';d.tabIndex=0;d.onclick=()=>openEdition(e);d.onkeydown=x=>{if(x.key==='Enter')openEdition(e)};d.innerHTML=`${smartImg(e.cover,'cover',e.title)}<div class="cardbody"><div class="title">${esc(e.title)}</div><div class="meta">${fmtOfEdition(e)} • ${(e.movies||[]).length} movie${(e.movies||[]).length===1?'':'s'}</div></div>`;return d;}
function openMovie(m){currentMovie=m;document.getElementById('modalContent').innerHTML=`<div class="detail"><div>${smartImg(m.poster,'mainimg',m.title)}</div><div><h2>${esc(m.title)}</h2><div class="meta">${esc(m.year||'')} ${m.runtime?'• '+esc(m.runtime)+' min':''} ${m.rating?'• Blu-ray.com '+esc(m.rating):''}</div><div class="section"><b>Owned In</b><div class="editionList">${(m.editions||[]).map(e=>`<div class="edition" onclick="openEditionByTitle('${escAttr(e.title)}')">${smartImg(e.cover,'',e.title)}<div class="editionTitle">${esc(e.title)}</div><div class="meta">${fmtOfEdition(e)}</div></div>`).join('')||'<p>No edition data.</p>'}</div></div><div class="section"><b>My Collections</b><div id="checks" class="checks"></div><div class="actions"><input id="newCollection" placeholder="New collection name"><button onclick="addCollection()">Add Collection</button></div></div><div class="section"><b>Status</b><div class="actions"><select id="watched" onchange="setWatched(this.value)"><option></option><option>Watched</option><option>Unwatched</option></select><select id="rating" onchange="setRating(this.value)"><option value="">My Rating</option><option>★★★★★</option><option>★★★★</option><option>★★★</option><option>★★</option><option>★</option></select></div></div><div class="section"><b>Notes</b><textarea id="note" oninput="setNote(this.value)" placeholder="Personal notes, shelf location, upgrade thoughts..."></textarea></div><div class="actions"><button onclick="hideModal()">Close</button></div></div></div>`;document.getElementById('watched').value=user.watched[m.id]||'';document.getElementById('rating').value=user.ratings[m.id]||'';document.getElementById('note').value=user.notes[m.id]||'';renderChecks();document.getElementById('modal').classList.remove('hidden');}
function openEditionByTitle(t){let clean=t.replace(/\\'/g,"'").replace(/&quot;/g,'"'); let e=editions.find(x=>x.title===clean); if(e) openEdition(e);}
function openEdition(e){let related=movies.filter(m=>(m.editions||[]).some(ed=>ed.title===e.title));document.getElementById('modalContent').innerHTML=`<div class="detail"><div>${smartImg(e.cover,'mainimg',e.title)}</div><div><h2>${esc(e.title)}</h2><div class="meta">${fmtOfEdition(e)} • ${(e.movies||[]).length} movie${(e.movies||[]).length===1?'':'s'}</div><div class="section"><b>Contains</b><div class="editionList">${related.map(m=>`<div class="edition" onclick="openMovieById(${m.id})">${smartImg(m.poster,'',m.title)}<div class="editionTitle">${esc(m.title)}</div><div class="meta">${esc(m.year||'')}</div></div>`).join('')}</div></div><div class="actions"><button onclick="hideModal()">Close</button></div></div></div>`;document.getElementById('modal').classList.remove('hidden');}
function openMovieById(id){let m=movies.find(x=>x.id===id); if(m) openMovie(m);}
function renderChecks(){let owned=new Set(movieCollections(currentMovie.id));document.getElementById('checks').innerHTML=user.collections.map(c=>`<label><input type="checkbox" ${owned.has(c)?'checked':''} onchange="toggleCollection('${escAttr(c)}',this.checked)"> ${esc(c)}</label>`).join('');}
function toggleCollection(c,on){c=c.replace(/\\'/g,"'").replace(/&quot;/g,'"');let arr=movieCollections(currentMovie.id).slice(); if(on&&!arr.includes(c))arr.push(c); if(!on)arr=arr.filter(x=>x!==c); user.memberships[currentMovie.id]=arr; save(); render();}
function addCollection(){let v=document.getElementById('newCollection')?.value.trim(); if(v&&!user.collections.includes(v)){user.collections.push(v); if(currentMovie){let arr=movieCollections(currentMovie.id).slice(); arr.push(v); user.memberships[currentMovie.id]=arr;} save(); fillFilters(); if(currentMovie)renderChecks(); render();}}
function setWatched(v){if(currentMovie){user.watched[currentMovie.id]=v;save();render();}} function setRating(v){if(currentMovie){user.ratings[currentMovie.id]=v;save();}} function setNote(v){if(currentMovie){user.notes[currentMovie.id]=v;save();}}
function renderCollections(grid){grid.className='';grid.innerHTML=`<div class="collectionRow"><input id="collectionName" placeholder="New collection, e.g. Tom Cruise"><button onclick="addCollectionFromManager()">Create</button></div>`+user.collections.map(c=>{let count=movies.filter(m=>movieCollections(m.id).includes(c)).length;return `<div class="collectionRow"><div><b>${esc(c)}</b><div class="meta">${count} movie${count===1?'':'s'}</div></div><div><button onclick="filterCollection('${escAttr(c)}')">View</button><button onclick="deleteCollection('${escAttr(c)}')">Delete</button></div></div>`}).join('');}
function addCollectionFromManager(){let v=document.getElementById('collectionName').value.trim(); if(v&&!user.collections.includes(v)){user.collections.push(v);save();render();}}
function filterCollection(c){c=c.replace(/\\'/g,"'").replace(/&quot;/g,'"');document.getElementById('collectionFilter').value=c;setView('movies');}
function deleteCollection(c){c=c.replace(/\\'/g,"'").replace(/&quot;/g,'"'); if(!confirm('Delete collection "'+c+'"? Movie records stay intact.'))return; user.collections=user.collections.filter(x=>x!==c); Object.keys(user.memberships).forEach(id=>user.memberships[id]=user.memberships[id].filter(x=>x!==c)); save();render();}
function pickRandom(){let q=document.getElementById('q').value.toLowerCase().trim(), cf=document.getElementById('collectionFilter').value, ff=document.getElementById('formatFilter').value;let list=movies.filter(m=>matchMovie(m,q,cf,ff)); if(list.length)openMovie(list[Math.floor(Math.random()*list.length)]);}
function toggleTV(){document.body.classList.toggle('tv');localStorage.setItem('pmc_tv',document.body.classList.contains('tv')?'1':'0');}
function exportData(){let blob=new Blob([JSON.stringify(user,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-physical-media-collection-custom-data.json';a.click();URL.revokeObjectURL(a.href);}
function importData(ev){let f=ev.target.files[0]; if(!f)return; let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);user={collections:obj.collections||DEFAULT_COLLECTIONS,memberships:obj.memberships||{},notes:obj.notes||{},ratings:obj.ratings||{},watched:obj.watched||{}};save();render();alert('Imported custom data.')}catch(e){alert('Could not import that JSON file.')}};r.readAsText(f);}
function hideModal(){document.getElementById('modal').classList.add('hidden')} function closeModal(e){if(e.target.id==='modal')hideModal()}
if(localStorage.getItem('pmc_tv')==='1')document.body.classList.add('tv');setView('movies');
</script></body></html>
